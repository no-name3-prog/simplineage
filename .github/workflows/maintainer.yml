name: Maintainer

# Senior maintainer bot: reviews every PR after CI succeeds.
# Final merge is always a human maintainer decision (not automated).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

concurrency:
  group: maintainer-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  actions: read

jobs:
  review:
    name: Senior maintainer (review only)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')

    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const n = '${{ inputs.pr_number }}';
              if (!n) throw new Error('pr_number is required');
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(n),
              });
              core.setOutput('number', String(pr.number));
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('draft', String(pr.draft));
              core.setOutput('title', pr.title);
              return;
            }
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            let pr = prs[0];
            if (run.pull_requests?.length) {
              const id = run.pull_requests[0].number;
              pr = prs.find(p => p.number === id) || pr;
              if (!pr) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: id,
                });
                pr = data;
              }
            }
            if (!pr) {
              core.setOutput('number', '');
              core.notice('No open PR for this CI run');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('draft', String(pr.draft));
            core.setOutput('title', pr.title);

      - name: Skip if no PR
        if: steps.pr.outputs.number == ''
        run: echo "No PR to process."

      - name: Checkout PR head
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base + maintainer script
        if: steps.pr.outputs.number != ''
        run: |
          git fetch origin main:main || git fetch origin "${{ github.event.repository.default_branch }}:main"
          if [ -f .github/scripts/maintainer-review.mjs ]; then
            cp .github/scripts/maintainer-review.mjs /tmp/maintainer-review.mjs
          else
            git show main:.github/scripts/maintainer-review.mjs > /tmp/maintainer-review.mjs
          fi
          chmod +x /tmp/maintainer-review.mjs

      - name: Validate PR description quality
        id: prbody
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.pr.outputs.number }}');
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            const body = (data.body || '').toLowerCase();
            const required = [
              ['summary', /##\s*summary/],
              ['design decisions', /##\s*design decisions/],
              ['testing', /##\s*testing/],
              ['future considerations', /##\s*future considerations/],
            ];
            const missing = required.filter(([, re]) => !re.test(body)).map(([n]) => n);
            core.setOutput('missing', missing.join(', '));
            core.setOutput('ok', missing.length === 0 ? 'true' : 'false');
            if (missing.length) {
              core.warning('PR body missing sections: ' + missing.join(', '));
            }

      - name: Run maintainer review
        id: review
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          BASE_SHA: main
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node /tmp/maintainer-review.mjs

      - name: Capture review outcome
        if: steps.pr.outputs.number != ''
        id: outcome
        run: |
          if [ -f /tmp/maintainer-verdict.json ]; then
            APPROVED=$(node -e "console.log(require('/tmp/maintainer-verdict.json').approved === true)")
            echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.prbody.outputs.ok }}" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "body_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_ok=true" >> "$GITHUB_OUTPUT"
            if [ -f /tmp/maintainer-verdict.json ]; then
              READY=$(node -e "console.log(require('/tmp/maintainer-verdict.json').approved === true)")
              echo "ready=$READY" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Augment review with PR body feedback
        if: steps.pr.outputs.number != '' && steps.prbody.outputs.ok != 'true'
        run: |
          {
            echo ""
            echo "### PR description gaps (must fix)"
            echo "- Missing required sections: **${{ steps.prbody.outputs.missing }}**"
            echo "- Update the PR body using \`.github/pull_request_template.md\`."
          } >> /tmp/maintainer-review.md

      - name: Append human final-approval notice
        if: steps.pr.outputs.number != ''
        run: |
          {
            echo ""
            echo "### Final approval (human)"
            echo ""
            if [ "${{ steps.outcome.outputs.ready }}" = "true" ]; then
              echo "Automated review found **no blockers** and the PR template looks complete."
              echo "**CI Success** is green for this head."
              echo ""
              echo "A **human maintainer** should do a final read and **squash-merge** when satisfied."
              echo "The bot will **not** merge automatically."
            else
              echo "Not ready for human merge yet — resolve blockers / template gaps, push, and wait for CI + re-review."
              echo "The bot will **not** merge automatically."
            fi
            echo ""
            echo "<!-- maintainer-bot-review -->"
          } >> /tmp/maintainer-review.md
          # Ensure single sticky marker at end (script already may include it)
          # Dedupe marker lines if doubled
          if [ "$(grep -c 'maintainer-bot-review' /tmp/maintainer-review.md || true)" -gt 1 ]; then
            # keep first occurrence only by truncating after first marker from original — skip; harmless duplicate in HTML comment
            true
          fi

      - name: Post maintainer review on PR
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          READY: ${{ steps.outcome.outputs.ready }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/maintainer-review.md', 'utf8');
            if (!body.includes('<!-- maintainer-bot-review -->')) {
              body += '\n<!-- maintainer-bot-review -->\n';
            }
            const pr = Number(process.env.PR_NUMBER);
            const ready = process.env.READY === 'true';
            // COMMENT for clean PRs (human merges). REQUEST_CHANGES for blockers.
            const event = ready ? 'COMMENT' : 'REQUEST_CHANGES';
            const marker = '<!-- maintainer-bot-review -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr,
                event,
                body: ready
                  ? 'Automated senior review: no blockers. Awaiting **human maintainer** final approval and squash-merge.'
                  : 'Automated senior review: please address blockers / PR description gaps, then push for CI + re-review.',
              });
            } catch (e) {
              core.warning(`createReview: ${e.message}`);
            }
