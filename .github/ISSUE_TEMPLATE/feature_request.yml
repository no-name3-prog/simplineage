name: Feature request
description: Suggest an enhancement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core / graph engine
        - Importers
        - Storage
        - Analysis
        - Exporters / HTML
        - CLI
        - Server / API
        - Language bindings
        - Docs / DX
        - CI / tooling
